org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# WITHOUT THIS THE SHARED NATIVE SOURCE SET CANNOT SEE THE CINTEROP. A cinterop klib is produced per
# target, so the metadata compilation of a source set shared between linuxX64 and macosArm64 - which
# is where the sampler wrapper lives, because the Kotlin above the C is identical - resolves none of
# its symbols. Commonization is what makes one interop declaration usable from both.
kotlin.mpp.enableCInteropCommonization=true

# The head of the version; CI appends the run number through -PVERSION.
version=0.1.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.razves
sborka.repository=youndie/razves
sborka.description=A size profiler for Kotlin/Native binaries: attribution by Kotlin package and klib module, and a Gradle budget gate.
sborka.inceptionYear=2026

# Built by 25, usable from 17. A Gradle plugin runs inside Gradle, on whatever JVM the consumer's
# build runs on, and Gradle 9 runs on 17+ - so the bytecode level of this jar is the floor of who
# can apply razves at all. It was 25, and proba caught what that means: the first published version
# resolved for nobody, because a consumer on Java 21 is told there is no matching variant. The
# published numbers come from binaries, not from the JVM that measured them.
sborka.jvmToolchain=25
sborka.jvmFloor=17
