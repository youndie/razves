[versions]
sborka = "0.4.0.43"
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
kotlinx-io = "0.9.1"
clikt = "5.1.0"
# The MCP SDK, at the version the portfolio already runs in tracy.
mcpSdk = "0.15.0"
kotlinx-coroutines = "1.10.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
# `clikt-core`, not `clikt`. The umbrella artifact pulls in `clikt-mordant`, and the two both define
# `kfun:com.github.ajalt.clikt.core#selfAndAncestors…` - which ld.lld refuses outright on a native
# link. razves reports the same pair as an ambiguous package before the linker ever sees it.
clikt = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcpSdk" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
